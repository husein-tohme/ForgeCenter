name: Check versions
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== fabric-api for 26.2 =="; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*+26\.2</version>' | tail -3
          echo "== loader game 26.2 =="; curl -s https://meta.fabricmc.net/v2/versions/loader/26.2 | jq -r '.[:1][].loader.version'
          git clone -q --depth 1 https://github.com/FabricMC/fabric-example-mod ex
          cd ex; echo "== branch: $(git rev-parse --abbrev-ref HEAD)"; for f in build.gradle settings.gradle gradle.properties gradle/wrapper/gradle-wrapper.properties src/main/resources/fabric.mod.json src/main/resources/*.mixins.json; do echo "===== $f"; cat $f; done
          echo "===== java files"; find src -name '*.java' | head; for f in $(find src -name '*Mixin*.java' | head -2); do echo "== $f"; cat $f; done
