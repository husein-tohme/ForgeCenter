name: Build mod (26.2)
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MOD_VERSION: 1.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      # The runner has no GPU or screen: a virtual screen plus Mesa's software OpenGL (llvmpipe).
      - name: Install a virtual screen and software OpenGL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri libglx-mesa0
          xvfb-run -a glxinfo -B | grep -E "renderer|version" || true

      - name: Show the game and test API methods the code uses
        continue-on-error: true
        run: |
          gradle printSignatures --no-daemon -q
          bash .github/scripts/inspect.sh 2>&1 | tee inspect.txt

      - name: Build
        run: gradle build gametestClasses --no-daemon

      - name: Play the game with the mod (client gametest)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          gradle runClientGameTest --no-daemon --stacktrace 2>&1 | tee gametest.log

      - name: Test result
        if: always()
        run: |
          f=build/run/clientGameTest/ec-result.json
          if [ ! -f "$f" ]; then echo "EC_RESULT missing: the test did not get far enough to write it"; exit 0; fi
          if [ "$GITHUB_REF" != "refs/heads/entity-compactor-26.2" ]; then
            # Where the next step uploads the screenshots.
            base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/ec26-test-results/run$GITHUB_RUN_NUMBER-"
            jq -c --arg base "$base" '.screenshotUrls = (.screenshots | map_values($base + (split("/") | last)))' "$f" > ec-result.json
          else
            jq -c . "$f" > ec-result.json
          fi
          echo "EC_RESULT $(cat ec-result.json)"

      - name: Check the game log for mixin problems
        if: always()
        run: bash .github/scripts/check-game-log.sh gametest.log build/run/clientGameTest/logs/latest.log

      # Test runs on other branches keep their screenshots and logs on a prerelease.
      - name: Collect screenshots and logs
        if: always() && github.ref != 'refs/heads/entity-compactor-26.2'
        run: |
          mkdir -p out
          n=run${{ github.run_number }}
          for f in build/run/clientGameTest/screenshots/*.png; do [ -f "$f" ] && cp "$f" "out/$n-$(basename "$f")"; done
          [ -f ec-result.json ] && cp ec-result.json "out/$n-ec-result.json"
          [ -f gametest.log ] && cp gametest.log "out/$n-gametest-log.txt"
          [ -f inspect.txt ] && cp inspect.txt "out/$n-inspect.txt"
          ls -la out
      - name: Upload screenshots and logs to the test prerelease
        if: always() && github.ref != 'refs/heads/entity-compactor-26.2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ec26-test-results
          name: Entity Compactor test results (not a release)
          body: Screenshots, results and logs from the in-game test runs. Files start with the run number.
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: out/*

      # Only the release branch publishes, and only when the build, the in-game test and the
      # log check above all passed.
      - name: Publish the release
        if: success() && github.ref == 'refs/heads/entity-compactor-26.2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: entity-compactor-v${{ env.MOD_VERSION }}-26.2
          name: Entity Compactor ${{ env.MOD_VERSION }} (Minecraft 26.2)
          target_commitish: ${{ github.sha }}
          body_path: README.md
          files: build/libs/entity-compactor-${{ env.MOD_VERSION }}+26.2.jar
          fail_on_unmatched_files: true
