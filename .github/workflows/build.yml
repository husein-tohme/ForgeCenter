name: Build mod (26.2)
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Show the game methods the mod hooks into
        continue-on-error: true
        run: |
          gradle printSignatures --no-daemon -q || true
          JAR=$(find ~/.gradle -name 'minecraft-*26.2*.jar' -size +5M | grep -v sources | head -3 | tr '\n' ':')
          echo "jars: $JAR"
          javap -cp "$JAR" net.minecraft.client.renderer.entity.EntityRenderDispatcher | grep -i shouldRender || true
          javap -cp "$JAR" net.minecraft.client.renderer.LevelRenderer | grep -i renderLevel || true
      - run: gradle build --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: entity-compactor-v1.0.0-26.2
          name: Entity Compactor 1.0.0 (Minecraft 26.2)
          target_commitish: ${{ github.sha }}
          body_path: README.md
          files: build/libs/entity-compactor-1.0.0+26.2.jar
