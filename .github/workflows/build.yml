name: Build mod
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: entity-compactor
          path: build/libs/entity-compactor-*.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: entity-compactor-v1.0.0
          name: Entity Compactor 1.0.0 (Minecraft 1.21.4)
          target_commitish: ${{ github.sha }}
          body_path: README.md
          files: build/libs/entity-compactor-1.0.0.jar
