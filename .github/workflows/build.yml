name: Build mod
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  # Never cancel a release halfway through uploading.
  cancel-in-progress: ${{ github.ref != 'refs/heads/entity-compactor' }}
env:
  JAR: entity-compactor-1.0.1+1.21.4.jar
jobs:
  test:
    name: Build and run the in-game test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EC_SCREENSHOT_URL_BASE: ${{ github.ref != 'refs/heads/entity-compactor' && format('https://github.com/{0}/releases/download/ec1214-test-results/', github.repository) || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - name: Build
        run: gradle build --no-daemon
      - name: Check the release jar
        run: |
          unzip -l build/libs/$JAR
          # Mixins find the game's real method names through the refmap; test code must not ship.
          unzip -p build/libs/$JAR entitycompactor.mixins.json | grep '"refmap"'
          if unzip -l build/libs/$JAR | grep -q 'compactor/test/'; then echo "Test classes in the release jar"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: entity-compactor
          path: build/libs/${{ env.JAR }}
          if-no-files-found: error
      - name: Install a virtual display and software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" glxinfo -B
      - name: Run the client gametest (real game, software rendering)
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" gradle runProductionClientGameTest --no-daemon --stacktrace 2>&1 | tee build/gametest-console.log
      - name: Show the result
        if: always()
        run: |
          line=$(grep -h -m1 -o 'EC_RESULT {.*' build/gametest-console.log || true)
          if [ -z "$line" ]; then echo "No EC_RESULT line: the test did not finish."; exit 1; fi
          echo "$line"
          { echo '```'; echo "$line"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$line" | grep -q '"pass":true'
      - name: Check the game log for mixin problems
        if: always()
        run: |
          logs=build/gametest-console.log
          [ -f build/run/clientGameTest/logs/latest.log ] && logs="$logs build/run/clientGameTest/logs/latest.log"
          bad=""
          for p in 'Mixin apply failed' 'Mixin apply for mod' 'MixinApplyError' 'MixinTransformerError' 'FAILED during APPLY' \
                   'InvalidInjectionException' 'MixinTargetAlreadyLoadedException' 'Could not find any targets'; do
            n=$(cat $logs | grep -c -- "$p" || true)
            echo "  '$p': $n"
            [ "$n" != 0 ] && bad="$bad$(grep -h -- "$p" $logs)"$'\n'
          done
          # Errors, exceptions or stack frames that name the mod. A failing test assertion is
          # reported by the steps above, so the test's own frames don't count here.
          named=$(grep -hiE 'entitycompactor|dev\.forgecenter' $logs | grep -E '/(ERROR|FATAL)\]|Exception|^\s+at ' \
            | grep -vE 'EC_RESULT|dev\.forgecenter\.compactor\.test\.|in-game test failed' || true)
          echo "  errors naming entitycompactor: $(printf '%s' "$named" | grep -c . || true)"
          bad="$bad$named"
          if [ -n "$(printf '%s' "$bad" | tr -d '[:space:]')" ]; then
            echo "MIXIN_CHECK: FAIL"; printf '%s\n' "$bad" | sort -u | head -50; exit 1
          fi
          echo "MIXIN_CHECK: PASS (no mixin failures or entitycompactor errors in $logs)"
          echo "MIXIN_CHECK: PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect test files
        if: always()
        run: |
          mkdir -p test-results
          cp build/run/clientGameTest/screenshots/*.png test-results/ 2>/dev/null || true
          cp build/run/clientGameTest/ec_result.json test-results/ 2>/dev/null || true
          cp build/run/clientGameTest/logs/latest.log test-results/game-latest.log 2>/dev/null || true
          ls -la test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
      # Test runs only: the release branch publishes the real release instead.
      - name: Publish screenshots to the test prerelease
        if: always() && github.ref != 'refs/heads/entity-compactor'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ec1214-test-results
          name: Entity Compactor 1.21.4 in-game test results
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Screenshots and results from the latest in-game test run (not a mod release).
            Commit ${{ github.sha }} on ${{ github.ref_name }}, run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: test-results/*
          fail_on_unmatched_files: false

  release:
    name: Publish the release
    needs: test
    if: github.ref == 'refs/heads/entity-compactor'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Stop if this version was already released from another commit
        run: |
          tagged=$(git ls-remote --tags origin refs/tags/entity-compactor-v1.0.1-1.21.4 | cut -f1)
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "entity-compactor-v1.0.1-1.21.4 already points at $tagged. Bump mod_version to release this commit."
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: entity-compactor
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: entity-compactor-v1.0.1-1.21.4
          name: Entity Compactor 1.0.1 (Minecraft 1.21.4)
          target_commitish: ${{ github.sha }}
          body_path: README.md
          files: ${{ env.JAR }}
          fail_on_unmatched_files: true
