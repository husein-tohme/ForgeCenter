plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+26.2"
group = 'dev.forgecenter'
base { archivesName = 'entity-compactor' }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
    mods {
        entitycompactor { sourceSet sourceSets.main }
    }
}

// The in-game test lives in src/gametest, its own source set, so it never ships in the mod jar.
// Run it with: gradle runClientGameTest
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'entitycompactor-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// Starts the test game on OpenGL: CI runners have no GPU, and Mesa's software OpenGL
// (llvmpipe) is what we install there. Written after Loom clears the run folder.
def openGlOptions = 'version:4896\npreferredGraphicsBackend:"opengl"\n'
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    doFirst {
        def dir = file('build/run/clientGameTest')
        dir.mkdirs()
        new File(dir, 'options.txt').text = openGlOptions
    }
}

// The same test against the built mod jar (the file we release), launched the way the real
// game launches mods: Fabric's production launcher, no dev classpath. gradle runJarGameTest
def gametestJar = tasks.register('gametestJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = 'gametest'
    destinationDirectory = layout.buildDirectory.dir('gametest-libs')
}
dependencies {
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    productionRuntimeMods fabricApi.module('fabric-client-gametest-api-v1', project.fabric_api_version)
}
tasks.register('runJarGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(gametestJar)
    jvmArgs.add('-Dfabric.client.gametest')
    runDir = file('build/run/jarGameTest')
    useXVFB = true
    doFirst {
        def dir = file('build/run/jarGameTest')
        dir.deleteDir()
        dir.mkdirs()
        new File(dir, 'options.txt').text = openGlOptions
    }
}

processResources {
    def version = project.version
    inputs.property 'version', version
    filesMatching('fabric.mod.json') { expand 'version': version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Prints where the game jar is, so CI can show the real signatures of the methods the mod hooks into.
tasks.register('printSignatures') {
    doLast {
        def jar = configurations.compileClasspath.files.find { it.name.contains('minecraft') && it.name.contains('26.2') }
        println "MC jar: ${jar}"
    }
}
